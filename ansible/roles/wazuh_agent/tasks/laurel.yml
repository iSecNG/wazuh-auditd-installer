---
# install-laurel.sh fetches the release tarball with curl and reports the
# binary's linkage with file. install.sh gets both as a side effect of its own
# repo setup; nothing here does, and a minimal Ubuntu/Debian image has neither
# -- without curl the download silently fails over to a full source build.
- name: Install LAUREL installer dependencies
  ansible.builtin.package:
    name: [curl, ca-certificates, file]
    state: present

# ponytail: runs this repo's install-laurel.sh instead of re-expressing its
# pinned-sha download, source-build fallback and plugin-dir detection in YAML.
# Port it to native tasks only if LAUREL config needs to be templated per host.
#
# Runs on every pass, with no `creates:`. With the binary present the script
# skips the install but still repairs the host: it loads the SELinux module
# that older installs lack and reloads auditd if LAUREL is not running. It does
# not upgrade, so changing laurel_version leaves existing hosts on their version.
# changed_when matches the script's messages for actual changes, so keep the two
# in sync.
- name: Install LAUREL
  ansible.builtin.script:
    cmd: "{{ wazuh_installer_repo }}/laurel/install-laurel.sh"
  environment:
    LAUREL_VERSION: "{{ laurel_version }}"
    LAUREL_SHA256: "{{ laurel_sha256 }}"
    LAUREL_BUILD_FROM_SOURCE: "{{ '1' if laurel_build_from_source else '0' }}"
  register: laurel_install
  changed_when: >-
    'Installed /usr/local/sbin/laurel' in laurel_install.stdout or
    "SELinux module 'laurel' loaded" in laurel_install.stdout or
    'signalling auditd' in laurel_install.stdout
